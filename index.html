<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Welkom in Utrecht Paula!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f2624;
    --water: #16332f;
    --water-deep: #0b1d1b;
    --brick: #c1694f;
    --gold: #e8b959;
    --cream: #f3ede1;
    --sage: #8fb0a3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    background: radial-gradient(120% 90% at 50% 0%, #1c3d38 0%, var(--ink) 55%, var(--water-deep) 100%);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw 0;
    overflow-x: hidden;
    position: relative;
  }

  .glow {
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,185,89,0.10) 0%, rgba(232,185,89,0) 70%);
    top: -120px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 1.4rem;
    z-index: 1;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 7vw, 4.6rem);
    text-align: center;
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: var(--cream);
    z-index: 1;
  }

  h1 em {
    font-style: italic;
    font-weight: 500;
    color: var(--brick);
  }

  .subtitle {
    font-family: 'Inter', sans-serif;
    font-size: clamp(0.95rem, 2vw, 1.1rem);
    color: var(--sage);
    max-width: 34ch;
    text-align: center;
    margin: 1.1rem 0 3.2rem;
    line-height: 1.5;
    z-index: 1;
  }

  .timer {
    display: flex;
    gap: clamp(0.6rem, 3vw, 1.8rem);
    z-index: 1;
    margin-bottom: 3rem;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 4.4rem;
  }

  .unit .value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: clamp(1.8rem, 6vw, 3.2rem);
    font-variant-numeric: tabular-nums;
    color: var(--cream);
    line-height: 1;
  }

  .unit .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--sage);
    margin-top: 0.6rem;
  }

  .divider {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(1.4rem, 5vw, 2.4rem);
    color: rgba(243,237,225,0.25);
    align-self: flex-start;
    margin-top: 0.1rem;
  }

  .copy-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--gold);
    border: none;
    padding: 0.85rem 1.6rem;
    border-radius: 999px;
    cursor: pointer;
    z-index: 1;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .copy-btn:hover { background: #f0c876; transform: translateY(-1px); }
  .copy-btn:active { transform: translateY(0); }
  .copy-btn:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }

  .skyline-wrap {
    width: 100%;
    margin-top: 5vh;
    position: relative;
    z-index: 0;
  }

  .skyline {
    width: 100%;
    height: auto;
    display: block;
    fill: var(--ink);
  }

  .reflection {
    width: 100%;
    height: auto;
    display: block;
    transform: scaleY(-1);
    fill: var(--ink);
    opacity: 0.35;
    filter: blur(1.5px);
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent 85%);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent 85%);
  }

  .water-band {
    height: 14vh;
    background: linear-gradient(to bottom, var(--water) 0%, var(--water-deep) 100%);
    position: relative;
    overflow: hidden;
  }

  .shimmer {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      100deg,
      transparent 0px,
      transparent 40px,
      rgba(232,185,89,0.06) 42px,
      transparent 44px,
      transparent 90px
    );
    animation: drift 9s linear infinite;
  }

  @keyframes drift {
    from { transform: translateX(-120px); }
    to { transform: translateX(0px); }
  }

  .lamp {
    animation: pulse 4.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .shimmer, .lamp { animation: none; }
  }

  @media (max-width: 480px) {
    .divider { display: none; }
    .timer { gap: 1.4rem; }
  }
</style>
</head>
<body>

  <div class="glow"></div>

  <div class="eyebrow">EEN TELLER TOT UTRECHT</div>

  <h1>Welkom <em>in</em> Utrecht</h1>

  <p class="subtitle" id="subtitle">
    Nog even geduld — dan sta je middenin de grachten.
  </p>

  <div class="timer" id="timer">
    <div class="unit"><span class="value" id="days">00</span><span class="label">dagen</span></div>
    <span class="divider">:</span>
    <div class="unit"><span class="value" id="hours">00</span><span class="label">uren</span></div>
    <span class="divider">:</span>
    <div class="unit"><span class="value" id="minutes">00</span><span class="label">minuten</span></div>
    <span class="divider">:</span>
    <div class="unit"><span class="value" id="seconds">00</span><span class="label">seconden</span></div>
  </div>

  <button class="copy-btn" id="copyBtn">Kopieer link</button>

  <div class="skyline-wrap">
    <svg class="skyline" viewBox="0 0 1200 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,160 L0,120 L40,120 L40,100 L70,100 L70,120 L110,120 L110,90 L140,90 L140,120 L190,120 L190,60 L200,60 L200,45 L206,45 L206,38 L214,38 L214,45 L220,45 L220,60 L230,60 L230,120 L280,120 L280,105 L300,105 L300,80 L330,80 L330,105 L360,105 L360,120 L420,120 L420,95 L440,95 L440,70 L460,70 L460,95 L480,95 L480,120 L540,120 L540,110 L565,110 L565,90 L590,90 L590,110 L615,110 L615,120 L680,120 L680,100 L705,100 L705,75 L725,75 L725,100 L750,100 L750,120 L820,120 L820,105 L845,105 L845,85 L870,85 L870,105 L895,105 L895,120 L960,120 L960,95 L985,95 L985,65 L1010,65 L1010,95 L1035,95 L1035,120 L1100,120 L1100,108 L1125,108 L1125,88 L1150,88 L1150,108 L1175,108 L1175,120 L1200,120 L1200,160 Z"/>
      <circle class="lamp" cx="207" cy="30" r="2.4" fill="#e8b959" opacity="0.8"/>
      <circle class="lamp" cx="450" cy="62" r="2" fill="#e8b959" opacity="0.7" style="animation-delay:1.2s"/>
      <circle class="lamp" cx="997" cy="58" r="2" fill="#e8b959" opacity="0.7" style="animation-delay:2.4s"/>
    </svg>
    <div class="water-band">
      <div class="shimmer"></div>
    </div>
  </div>

  <script>
    /* ============================================
       CUSTOMIZE HERE
       ============================================ */
    const TARGET_DATE = "2026-08-29T21:36:00"; // <-- change to your date/time
    const SUBTITLE_TEXT = "Nog even geduld — dan sta je middenin de grachten."; // <-- change the message
    /* ============================================ */

    document.getElementById('subtitle').textContent = SUBTITLE_TEXT;
    const target = new Date(TARGET_DATE).getTime();

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      const now = Date.now();
      const diff = target - now;

      if (diff <= 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        document.getElementById('subtitle').textContent = "Welkom thuis in Utrecht. 🎉";
        clearInterval(interval);
        return;
      }

      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const minutes = Math.floor((diff % 3600000) / 60000);
      const seconds = Math.floor((diff % 60000) / 1000);

      document.getElementById('days').textContent = pad(days);
      document.getElementById('hours').textContent = pad(hours);
      document.getElementById('minutes').textContent = pad(minutes);
      document.getElementById('seconds').textContent = pad(seconds);
    }

    tick();
    const interval = setInterval(tick, 1000);

    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href).then(() => {
        const btn = document.getElementById('copyBtn');
        const original = btn.textContent;
        btn.textContent = 'Gekopieerd ✓';
        setTimeout(() => { btn.textContent = original; }, 1800);
      });
    });
  </script>

</body>
</html>
