<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onderweg naar Utrecht</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap');

  :root{
    --ink:#1c2b29;
    --canal:#1f3b3a;
    --canal-light:#2f5250;
    --parchment:#f2efe6;
    --brick:#b5533c;
    --gold:#c9a15a;
    --line:#d8d2c2;
    --radius:6px;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--parchment);
    color:var(--ink);
    font-family:'Source Sans 3', sans-serif;
    line-height:1.5;
  }

  h1, h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    margin:0;
  }

  a{ color:inherit; }

  /* ---------- Header / countdown ---------- */

  header{
    background:var(--canal);
    color:var(--parchment);
    padding:4.5rem 1.5rem 3.5rem;
    text-align:center;
    position:relative;
    overflow:hidden;
  }

  header::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:14px;
    background:
      radial-gradient(circle at 10px 0, transparent 9px, var(--parchment) 10px) 0 -9px / 24px 14px repeat-x;
  }

  .eyebrow-word{
    font-size:0.95rem;
    letter-spacing:0.02em;
    color:var(--gold);
    margin-bottom:0.75rem;
  }

  header h1{
    font-size:clamp(2.1rem, 5vw, 3.2rem);
    max-width:20ch;
    margin:0 auto 0.6rem;
  }

  #subtitle{
    font-size:1.05rem;
    color:#cfe0dd;
    max-width:32ch;
    margin:0 auto 2.4rem;
  }

  .timer-box{
    display:inline-block;
    border:1px solid rgba(242,239,230,0.25);
    border-radius:var(--radius);
    padding:1.1rem 1.8rem;
    background:rgba(242,239,230,0.06);
  }

  .timer-label{
    font-size:0.8rem;
    color:#a9c2be;
    margin-bottom:0.35rem;
  }

  #timerValue{
    font-family:'Fraunces', serif;
    font-size:clamp(1.5rem, 4vw, 2.1rem);
    font-variant-numeric: tabular-nums;
    color:var(--parchment);
  }

  /* ---------- Gallery section ---------- */

  main{
    max-width:960px;
    margin:0 auto;
    padding:3.5rem 1.5rem 5rem;
  }

  .gallery-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:0.75rem 1.5rem;
    margin-bottom:1.6rem;
    border-bottom:1px solid var(--line);
    padding-bottom:1.1rem;
  }

  .gallery-head h2{
    font-size:1.6rem;
  }

  .gallery-meta{
    display:flex;
    align-items:center;
    gap:1rem;
    font-size:0.92rem;
    color:#5c6663;
  }

  button{
    font-family:'Source Sans 3', sans-serif;
    font-size:0.92rem;
    cursor:pointer;
    border-radius:var(--radius);
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .btn-primary{
    background:var(--brick);
    color:var(--parchment);
    border:1px solid var(--brick);
    padding:0.6rem 1.1rem;
    font-weight:500;
  }
  .btn-primary:hover{ background:#9c4531; }

  .btn-secondary{
    background:transparent;
    color:var(--canal);
    border:1px solid var(--line);
    padding:0.6rem 1.1rem;
  }
  .btn-secondary:hover{ border-color:var(--canal); }
  .btn-secondary:disabled{
    opacity:0.4;
    cursor:default;
    border-color:var(--line);
  }

  #galleryStatus{
    min-height:1.2em;
    font-size:0.88rem;
    color:var(--brick);
    margin-bottom:1rem;
  }

  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:0.8rem;
  }

  .gallery-tile{
    position:relative;
    aspect-ratio:1;
    border-radius:var(--radius);
    overflow:hidden;
    background:#e4ded0;
  }

  .gallery-tile img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    cursor:zoom-in;
  }

  .gallery-download,
  .gallery-remove{
    position:absolute;
    top:6px;
    width:28px;
    height:28px;
    border:none;
    border-radius:50%;
    background:rgba(28,43,41,0.65);
    color:#fff;
    font-size:0.85rem;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition:opacity 0.15s ease, background 0.15s ease;
  }
  .gallery-tile:hover .gallery-download,
  .gallery-tile:hover .gallery-remove{ opacity:1; }

  .gallery-download{ right:40px; }
  .gallery-remove{ right:6px; }
  .gallery-download:hover{ background:var(--canal); }
  .gallery-remove:hover{ background:var(--brick); }

  .add-tile{
    aspect-ratio:1;
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
    background:transparent;
    color:#8b8577;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:0.35rem;
    font-size:0.85rem;
  }
  .add-tile:hover{
    border-color:var(--canal);
    color:var(--canal);
  }
  .add-tile .plus{
    font-family:'Fraunces', serif;
    font-size:1.8rem;
    line-height:1;
  }

  /* ---------- Lightbox ---------- */

  .lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(17,24,23,0.9);
    align-items:center;
    justify-content:center;
    padding:2rem;
    z-index:50;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{
    max-width:100%;
    max-height:100%;
    border-radius:4px;
  }
  .lightbox-close{
    position:absolute;
    top:1.2rem;
    right:1.5rem;
    background:transparent;
    border:none;
    color:#f2efe6;
    font-size:1.8rem;
    line-height:1;
  }

  footer{
    text-align:center;
    font-size:0.82rem;
    color:#8b8577;
    padding:0 1.5rem 3rem;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow-word">Gallery</div>
  <h1>Paula und Vali Utrecht 29.08-01.09.2026</h1>
</header>

<main>
  <div class="gallery-head">
    <h2>Samen verzameld</h2>
    <div class="gallery-meta">
      <span id="galleryCount">0 foto's</span>
      <button id="downloadAllBtn" class="btn-secondary" disabled>Alles downloaden</button>
      <button id="galleryAddBtnHeader" class="btn-primary">Foto toevoegen</button>
    </div>
  </div>

  <p id="galleryStatus"></p>

  <input id="galleryInput" type="file" accept="image/*" multiple style="display:none;">

  <div id="galleryGrid" class="gallery-grid">
    <button id="galleryAddBtn" class="add-tile" type="button">
      <span class="plus">+</span>
      <span>Foto toevoegen</span>
    </button>
  </div>
</main>

<footer>
  Gemaakt voor twee.
</footer>

<div id="lightbox" class="lightbox">
  <button id="lightboxClose" class="lightbox-close" aria-label="Sluiten">&times;</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
  import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 1. Paste your Firebase credentials here:
  const firebaseConfig = {
    apiKey: "AIzaSyAhLDFnxEsKsG9Sn2IoXP5UfhtXGy-Lv3o",
    authDomain: "utrecht-gallery-19444.firebaseapp.com",
    projectId: "utrecht-gallery-19444",
    storageBucket: "utrecht-gallery-19444.firebasestorage.app",
    messagingSenderId: "95595424229",
    appId: "1:95595424229:web:ead8dca64cbd30f6a8e70c"
  };

  const app = initializeApp(firebaseConfig);
  const storage = getStorage(app);
  const db = getFirestore(app);

  // --- Countdown Timer ---
  const TARGET_DATE = "2026-08-29T21:36:00";
  const SUBTITLE_TEXT = "Nog even geduld — dan sta je middenin de grachten.";
  const subtitle = document.getElementById('subtitle');
  const target = new Date(TARGET_DATE).getTime();
  const timerValue = document.getElementById('timerValue');

  subtitle.textContent = SUBTITLE_TEXT;

  function pad(value) { return String(value).padStart(2, '0'); }

  function tick() {
    const now = Date.now();
    const diff = target - now;

    if (diff <= 0) {
      subtitle.textContent = 'Welkom thuis in Utrecht. 🎉';
      timerValue.textContent = 'aangekomen';
      return;
    }

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);

    timerValue.textContent = `${days}d ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
  }
  tick();
  setInterval(tick, 1000);

  // --- Public Gallery (Shared across all users/devices) ---
  const galleryGrid = document.getElementById('galleryGrid');
  const galleryAddBtn = document.getElementById('galleryAddBtn');
  const galleryAddBtnHeader = document.getElementById('galleryAddBtnHeader');
  const galleryInput = document.getElementById('galleryInput');
  const galleryCount = document.getElementById('galleryCount');
  const galleryStatus = document.getElementById('galleryStatus');
  const downloadAllBtn = document.getElementById('downloadAllBtn');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');

  let currentPhotos = [];

  function setStatus(msg) { galleryStatus.textContent = msg || ''; }

  function updateCount(n) {
    galleryCount.textContent = n === 1 ? '1 foto' : `${n} foto's`;
    downloadAllBtn.disabled = n === 0;
  }

  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.classList.add('open');
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
  }

  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

  function downloadDataUrl(url, filename) {
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
  }

  function makeTile(id, url) {
    const tile = document.createElement('div');
    tile.className = 'gallery-tile';
    tile.dataset.id = id;

    const img = document.createElement('img');
    img.src = url;
    img.alt = 'Foto van het bezoek';
    img.addEventListener('click', () => openLightbox(url));

    const downloadBtn = document.createElement('button');
    downloadBtn.className = 'gallery-download';
    downloadBtn.type = 'button';
    downloadBtn.title = 'Downloaden';
    downloadBtn.textContent = '⬇';
    downloadBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      downloadDataUrl(url, `utrecht-${id}.jpg`);
    });

    const removeBtn = document.createElement('button');
    removeBtn.className = 'gallery-remove';
    removeBtn.type = 'button';
    removeBtn.title = 'Verwijderen';
    removeBtn.textContent = '✕';
    removeBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (confirm("Weet je zeker dat je deze foto voor iedereen wilt verwijderen?")) {
        await deleteDoc(doc(db, "photos", id));
      }
    });

    tile.appendChild(img);
    tile.appendChild(downloadBtn);
    tile.appendChild(removeBtn);
    return tile;
  }

  // Live Listener: Listens for uploads from ANY device and renders them instantly
  const photosQuery = query(collection(db, "photos"), orderBy("createdAt", "asc"));
  onSnapshot(photosQuery, (snapshot) => {
    // Clear current tiles except for the "+ Foto toevoegen" tile
    document.querySelectorAll('.gallery-tile').forEach(el => el.remove());

    currentPhotos = [];
    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const id = docSnap.id;
      currentPhotos.push({ id, url: data.url });
      galleryGrid.insertBefore(makeTile(id, data.url), galleryAddBtn);
    });

    updateCount(currentPhotos.length);
    setStatus('');
  }, (err) => {
    console.error("Firebase read error:", err);
    setStatus("Kon foto's niet laden.");
  });

  // Client-side image compression before upload
  function resizeImage(file, maxDim = 1600, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Bestand kon niet worden gelezen'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('Afbeelding kon niet worden geladen'));
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            const scale = maxDim / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // Upload handler (Pushes images to the cloud)
  async function addPhotos(files) {
    for (const file of files) {
      if (!file.type.startsWith('image/')) continue;
      setStatus(`Bezig met uploaden: ${file.name}…`);
      try {
        const compressedBlob = await resizeImage(file);
        const fileName = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
        const storageRef = ref(storage, `gallery/${fileName}`);

        await uploadBytes(storageRef, compressedBlob);
        const downloadURL = await getDownloadURL(storageRef);

        await addDoc(collection(db, "photos"), {
          url: downloadURL,
          createdAt: new Date()
        });
      } catch (err) {
        console.error("Upload error:", err);
        setStatus(`Kon "${file.name}" niet uploaden.`);
      }
    }
  }

  galleryAddBtn.addEventListener('click', () => galleryInput.click());
  galleryAddBtnHeader.addEventListener('click', () => galleryInput.click());
  galleryInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length) addPhotos(files);
    galleryInput.value = '';
  });

  downloadAllBtn.addEventListener('click', async () => {
    if (typeof JSZip === 'undefined') {
      setStatus('Zip-bibliotheek kon niet worden geladen.');
      return;
    }
    downloadAllBtn.disabled = true;
    setStatus('Zip-bestand maken…');
    try {
      const zip = new JSZip();
      let count = 0;
      for (const item of currentPhotos) {
        const resp = await fetch(item.url);
        const blob = await resp.blob();
        zip.file(`utrecht-${item.id}.jpg`, blob);
        count++;
      }
      if (count === 0) {
        setStatus("Geen foto's om te downloaden.");
        return;
      }
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(zipBlob);
      downloadDataUrl(url, 'utrecht-fotos.zip');
      URL.revokeObjectURL(url);
      setStatus('');
    } catch (err) {
      console.error(err);
      setStatus('Kon zip-bestand niet maken.');
    } finally {
      downloadAllBtn.disabled = false;
    }
  });
</script>

</body>
</html>
