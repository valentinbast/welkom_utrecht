<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onderweg naar Utrecht</title>
<!-- Leaflet CSS for Interactive Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap');

  :root{
    --ink:#1c2b29;
    --canal:#1f3b3a;
    --canal-light:#2f5250;
    --parchment:#f2efe6;
    --brick:#b5533c;
    --gold:#c9a15a;
    --line:#d8d2c2;
    --radius:6px;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--parchment);
    color:var(--ink);
    font-family:'Source Sans 3', sans-serif;
    line-height:1.5;
  }

  h1, h2, h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    margin:0;
  }

  a{ color:inherit; }

  /* ---------- Header ---------- */

  header{
    background:var(--canal);
    color:var(--parchment);
    padding:4.5rem 1.5rem 3.5rem;
    text-align:center;
    position:relative;
    overflow:hidden;
  }

  header::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:14px;
    background:
      radial-gradient(circle at 10px 0, transparent 9px, var(--parchment) 10px) 0 -9px / 24px 14px repeat-x;
  }

  .eyebrow-word{
    font-size:0.95rem;
    letter-spacing:0.02em;
    color:var(--gold);
    margin-bottom:0.75rem;
  }

  header h1{
    font-size:clamp(2.1rem, 5vw, 3.2rem);
    max-width:20ch;
    margin:0 auto 0.6rem;
  }

  #subtitle{
    font-size:1.05rem;
    color:#cfe0dd;
    max-width:32ch;
    margin:0 auto 2.4rem;
  }

  .timer-box{
    display:inline-block;
    border:1px solid rgba(242,239,230,0.25);
    border-radius:var(--radius);
    padding:1.1rem 1.8rem;
    background:rgba(242,239,230,0.06);
  }

  .timer-label{
    font-size:0.8rem;
    color:#a9c2be;
    margin-bottom:0.35rem;
  }

  #timerValue{
    font-family:'Fraunces', serif;
    font-size:clamp(1.5rem, 4vw, 2.1rem);
    font-variant-numeric: tabular-nums;
    color:var(--parchment);
  }

  /* ---------- Carousel ---------- */

  .carousel-section {
    max-width:960px;
    margin:0 auto;
    padding:2.5rem 1.5rem 1rem;
  }

  .carousel-section h2 {
    font-size:1.5rem;
    margin-bottom:1rem;
    color:var(--canal);
  }

  .carousel-container {
    position:relative;
    background:#e4ded0;
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 8px 24px rgba(28,43,41,0.08);
  }

  .carousel-view {
    position:relative;
    width:100%;
    height:380px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--canal);
  }

  .carousel-img {
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    cursor:pointer;
  }

  .carousel-btn {
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(28,43,41,0.65);
    color:#fff;
    border:none;
    width:42px;
    height:42px;
    border-radius:50%;
    font-size:1.2rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background 0.2s ease;
    z-index:10;
  }
  .carousel-btn:hover { background:var(--brick); }
  .carousel-btn.prev { left:12px; }
  .carousel-btn.next { right:12px; }

  .carousel-thumbs {
    display:flex;
    gap:0.5rem;
    padding:0.75rem;
    background:var(--parchment);
    border:1px solid var(--line);
    border-top:none;
    border-bottom-left-radius:var(--radius);
    border-bottom-right-radius:var(--radius);
    overflow-x:auto;
  }

  .thumb-item {
    width:60px;
    height:60px;
    border-radius:4px;
    object-fit:cover;
    cursor:pointer;
    opacity:0.6;
    transition:opacity 0.15s ease, border-color 0.15s ease;
    border:2px solid transparent;
    flex-shrink:0;
  }
  .thumb-item:hover { opacity:0.85; }
  .thumb-item.active {
    opacity:1;
    border-color:var(--brick);
  }

  .carousel-empty {
    padding:3rem;
    text-align:center;
    color:#8b8577;
    font-style:italic;
  }

  /* ---------- Map Section ---------- */

  .map-section {
    max-width:960px;
    margin:2rem auto 1rem;
    padding:0 1.5rem;
  }

  .map-section h2 {
    font-size:1.5rem;
    margin-bottom:1rem;
    color:var(--canal);
  }

  #map {
    width:100%;
    height:360px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    box-shadow:0 4px 16px rgba(28,43,41,0.06);
    z-index:1;
  }

  .map-popup-content {
    font-family:'Source Sans 3', sans-serif;
    color:var(--ink);
  }
  .map-popup-content h4 {
    margin:0 0 0.3rem;
    font-family:'Fraunces', serif;
    color:var(--canal);
  }
  .map-popup-content p {
    margin:0 0 0.6rem;
    font-size:0.85rem;
    color:#5c6663;
  }
  .map-popup-thumbs {
    display:flex;
    gap:0.4rem;
    overflow-x:auto;
  }
  .map-popup-thumb {
    width:50px;
    height:50px;
    object-fit:cover;
    border-radius:4px;
    cursor:pointer;
  }

  /* ---------- Main & Gallery ---------- */

  main{
    max-width:960px;
    margin:0 auto;
    padding:2rem 1.5rem 3rem;
  }

  .gallery-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:0.75rem 1.5rem;
    margin-bottom:1.6rem;
    border-bottom:1px solid var(--line);
    padding-bottom:1.1rem;
  }

  .gallery-head h2{ font-size:1.6rem; }

  .gallery-meta{
    display:flex;
    align-items:center;
    gap:1rem;
    font-size:0.92rem;
    color:#5c6663;
  }

  button{
    font-family:'Source Sans 3', sans-serif;
    font-size:0.92rem;
    cursor:pointer;
    border-radius:var(--radius);
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .btn-primary{
    background:var(--brick);
    color:var(--parchment);
    border:1px solid var(--brick);
    padding:0.6rem 1.1rem;
    font-weight:500;
  }
  .btn-primary:hover{ background:#9c4531; }

  .btn-secondary{
    background:transparent;
    color:var(--canal);
    border:1px solid var(--line);
    padding:0.6rem 1.1rem;
  }
  .btn-secondary:hover{ border-color:var(--canal); }
  .btn-secondary:disabled{
    opacity:0.4;
    cursor:default;
    border-color:var(--line);
  }

  #galleryStatus{
    min-height:1.2em;
    font-size:0.88rem;
    color:var(--brick);
    margin-bottom:1rem;
  }

  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:0.8rem;
  }

  .gallery-tile{
    position:relative;
    aspect-ratio:1;
    border-radius:var(--radius);
    overflow:hidden;
    background:#e4ded0;
  }

  .gallery-tile img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    cursor:zoom-in;
  }

  .gallery-download,
  .gallery-remove{
    position:absolute;
    top:6px;
    width:28px;
    height:28px;
    border:none;
    border-radius:50%;
    background:rgba(28,43,41,0.65);
    color:#fff;
    font-size:0.85rem;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition:opacity 0.15s ease, background 0.15s ease;
  }
  .gallery-tile:hover .gallery-download,
  .gallery-tile:hover .gallery-remove{ opacity:1; }

  .gallery-download{ right:40px; }
  .gallery-remove{ right:6px; }
  .gallery-download:hover{ background:var(--canal); }
  .gallery-remove:hover{ background:var(--brick); }

  .add-tile{
    aspect-ratio:1;
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
    background:transparent;
    color:#8b8577;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:0.35rem;
    font-size:0.85rem;
  }
  .add-tile:hover{
    border-color:var(--canal);
    color:var(--canal);
  }
  .add-tile .plus{
    font-family:'Fraunces', serif;
    font-size:1.8rem;
    line-height:1;
  }

  /* ---------- Journal ---------- */

  .journal-section {
    max-width:960px;
    margin:2rem auto 5rem;
    padding:0 1.5rem;
  }

  .journal-head {
    border-bottom:1px solid var(--line);
    padding-bottom:0.8rem;
    margin-bottom:1.5rem;
  }

  .journal-head h2 {
    font-size:1.6rem;
    color:var(--canal);
  }

  .journal-form {
    background:#e8e2d5;
    padding:1.2rem;
    border-radius:var(--radius);
    margin-bottom:2rem;
    border:1px solid var(--line);
  }

  .journal-form textarea {
    width:100%;
    min-height:80px;
    padding:0.75rem;
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-family:'Source Sans 3', sans-serif;
    font-size:0.95rem;
    background:var(--parchment);
    color:var(--ink);
    resize:vertical;
    margin-bottom:0.8rem;
  }

  .journal-form textarea:focus {
    outline:none;
    border-color:var(--canal);
  }

  .journal-controls {
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:0.75rem;
  }

  .audio-recorder {
    display:flex;
    align-items:center;
    gap:0.5rem;
  }

  .btn-record {
    background:transparent;
    border:1px solid var(--brick);
    color:var(--brick);
    padding:0.5rem 0.9rem;
    display:flex;
    align-items:center;
    gap:0.4rem;
  }
  .btn-record.recording {
    background:var(--brick);
    color:var(--parchment);
    animation:pulse 1.2s infinite;
  }

  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  .journal-list {
    display:flex;
    flex-direction:column;
    gap:1rem;
  }

  .journal-card {
    background:var(--parchment);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:1rem 1.2rem;
    position:relative;
    box-shadow:0 2px 8px rgba(0,0,0,0.03);
  }

  .journal-card-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.8rem;
    color:#7a8582;
    margin-bottom:0.5rem;
  }

  .journal-card-delete {
    background:transparent;
    border:none;
    color:#a19b8f;
    cursor:pointer;
    font-size:1rem;
  }
  .journal-card-delete:hover { color:var(--brick); }

  .journal-text {
    font-size:0.98rem;
    white-space:pre-wrap;
    margin-bottom:0.5rem;
  }

  .journal-audio {
    margin-top:0.6rem;
    width:100%;
    height:36px;
  }

  /* ---------- Lightbox ---------- */

  .lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(17,24,23,0.9);
    align-items:center;
    justify-content:center;
    padding:2rem;
    z-index:50;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{
    max-width:100%;
    max-height:100%;
    border-radius:4px;
  }
  .lightbox-close{
    position:absolute;
    top:1.2rem;
    right:1.5rem;
    background:transparent;
    border:none;
    color:#f2efe6;
    font-size:1.8rem;
    line-height:1;
  }

  footer{
    text-align:center;
    font-size:0.82rem;
    color:#8b8577;
    padding:0 1.5rem 3rem;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow-word">Gallery</div>
  <h1>Paula und Vali Utrecht 29.08-01.09.2026</h1>
  <p id="subtitle">Welkom thuis in Utrecht. 🎉</p>
  <div class="timer-box">
    <div class="timer-label">Status</div>
    <div id="timerValue">0d 00:00:00</div>
  </div>
</header>

<section class="carousel-section">
  <h2>Hoogtepunten</h2>
  <div class="carousel-container">
    <div id="carouselView" class="carousel-view">
      <div id="carouselEmpty" class="carousel-empty">Nog geen foto's om te bekijken.</div>
      <img id="carouselImg" class="carousel-img" src="" alt="" style="display:none;">
      <button id="carouselPrev" class="carousel-btn prev" type="button" style="display:none;">❮</button>
      <button id="carouselNext" class="carousel-btn next" type="button" style="display:none;">❯</button>
    </div>
    <div id="carouselThumbs" class="carousel-thumbs" style="display:none;"></div>
  </div>
</section>

<!-- NEW: Interactive Map Section -->
<section class="map-section">
  <h2>Plekken in Utrecht</h2>
  <div id="map"></div>
</section>

<main>
  <div class="gallery-head">
    <h2>Samen verzameld</h2>
    <div class="gallery-meta">
      <span id="galleryCount">0 foto's</span>
      <button id="downloadAllBtn" class="btn-secondary" disabled>Alles downloaden</button>
      <button id="galleryAddBtnHeader" class="btn-primary">Foto toevoegen</button>
    </div>
  </div>

  <p id="galleryStatus"></p>

  <input id="galleryInput" type="file" accept="image/*" multiple style="display:none;">

  <div id="galleryGrid" class="gallery-grid">
    <button id="galleryAddBtn" class="add-tile" type="button">
      <span class="plus">+</span>
      <span>Foto toevoegen</span>
    </button>
  </div>
</main>

<section class="journal-section">
  <div class="journal-head">
    <h2>Herinneringen & Spraakmemo's</h2>
  </div>

  <div class="journal-form">
    <textarea id="noteInput" placeholder="Schrijf een mooie herinnering of gedachte..."></textarea>
    <div class="journal-controls">
      <div class="audio-recorder">
        <button id="recordBtn" class="btn-record" type="button">
          <span id="recordIcon">🎙️</span>
          <span id="recordLabel">Inspreken</span>
        </button>
        <span id="recordTimer" style="font-size:0.85rem; color:var(--brick);"></span>
      </div>
      <button id="saveNoteBtn" class="btn-primary" type="button">Opslaan</button>
    </div>
  </div>

  <div id="journalList" class="journal-list"></div>
</section>

<footer>
  Gemaakt voor twee.
</footer>

<div id="lightbox" class="lightbox">
  <button id="lightboxClose" class="lightbox-close" aria-label="Sluiten">&times;</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
  import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAhLDFnxEsKsG9Sn2IoXP5UfhtXGy-Lv3o",
    authDomain: "utrecht-gallery-19444.firebaseapp.com",
    projectId: "utrecht-gallery-19444",
    storageBucket: "utrecht-gallery-19444.firebasestorage.app",
    messagingSenderId: "95595424229",
    appId: "1:95595424229:web:ead8dca64cbd30f6a8e70c"
  };

  const app = initializeApp(firebaseConfig);
  const storage = getStorage(app);
  const db = getFirestore(app);

  // Gallery Elements
  const galleryGrid = document.getElementById('galleryGrid');
  const galleryAddBtn = document.getElementById('galleryAddBtn');
  const galleryAddBtnHeader = document.getElementById('galleryAddBtnHeader');
  const galleryInput = document.getElementById('galleryInput');
  const galleryCount = document.getElementById('galleryCount');
  const galleryStatus = document.getElementById('galleryStatus');
  const downloadAllBtn = document.getElementById('downloadAllBtn');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');

  // Carousel Elements
  const carouselImg = document.getElementById('carouselImg');
  const carouselEmpty = document.getElementById('carouselEmpty');
  const carouselPrev = document.getElementById('carouselPrev');
  const carouselNext = document.getElementById('carouselNext');
  const carouselThumbs = document.getElementById('carouselThumbs');

  // Journal Elements
  const noteInput = document.getElementById('noteInput');
  const saveNoteBtn = document.getElementById('saveNoteBtn');
  const recordBtn = document.getElementById('recordBtn');
  const recordLabel = document.getElementById('recordLabel');
  const recordIcon = document.getElementById('recordIcon');
  const recordTimer = document.getElementById('recordTimer');
  const journalList = document.getElementById('journalList');

  let currentPhotos = [];
  let carouselIndex = 0;

  let mediaRecorder = null;
  let audioChunks = [];
  let recordedAudioBlob = null;
  let isRecording = false;

  function setStatus(msg) { galleryStatus.textContent = msg || ''; }

  function updateCount(n) {
    galleryCount.textContent = n === 1 ? '1 foto' : `${n} foto's`;
    downloadAllBtn.disabled = n === 0;
  }

  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.classList.add('open');
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
  }

  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

  window.openLightboxFromMap = openLightbox;

  // --- Interactive Leaflet Map ---
  const utrechtCoords = [52.0907, 5.1214];
  const map = L.map('map').setView(utrechtCoords, 14);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  const spots = [
    { name: "Domtoren", coords: [52.0906, 5.1213], desc: "De iconische toren van Utrecht." },
    { name: "Oudegracht", coords: [52.0892, 5.1205], desc: "Wandelen langs de werfskelders." },
    { name: "Café de Zaak", coords: [52.0931, 5.1189], desc: "Gezellig een drankje doen." },
    { name: "Wilhelminapark", coords: [52.0863, 5.1381], desc: "Ontspannen in het park." }
  ];

  function updateMapPopups() {
    spots.forEach(spot => {
      let popupHtml = `
        <div class="map-popup-content">
          <h4>${spot.name}</h4>
          <p>${spot.desc}</p>
      `;

      if (currentPhotos.length > 0) {
        popupHtml += `<div class="map-popup-thumbs">`;
        currentPhotos.slice(0, 3).forEach(p => {
          popupHtml += `<img src="${p.url}" class="map-popup-thumb" onclick="window.openLightboxFromMap('${p.url}')">`;
        });
        popupHtml += `</div>`;
      } else {
        popupHtml += `<p style="font-size:0.75rem; color:#8b8577; margin:0;">Nog geen foto's hier gekoppeld.</p>`;
      }

      popupHtml += `</div>`;

      if (spot.marker) {
        spot.marker.setPopupContent(popupHtml);
      } else {
        spot.marker = L.marker(spot.coords).addTo(map).bindPopup(popupHtml);
      }
    });
  }

  updateMapPopups();

  // Carousel
  function renderCarousel() {
    if (currentPhotos.length === 0) {
      carouselEmpty.style.display = 'block';
      carouselImg.style.display = 'none';
      carouselPrev.style.display = 'none';
      carouselNext.style.display = 'none';
      carouselThumbs.style.display = 'none';
      carouselThumbs.innerHTML = '';
      return;
    }

    if (carouselIndex >= currentPhotos.length) {
      carouselIndex = Math.max(0, currentPhotos.length - 1);
    }

    carouselEmpty.style.display = 'none';
    carouselImg.style.display = 'block';
    carouselImg.src = currentPhotos[carouselIndex].url;

    carouselPrev.style.display = currentPhotos.length > 1 ? 'flex' : 'none';
    carouselNext.style.display = currentPhotos.length > 1 ? 'flex' : 'none';
    carouselThumbs.style.display = currentPhotos.length > 1 ? 'flex' : 'none';

    carouselThumbs.innerHTML = '';
    currentPhotos.forEach((item, idx) => {
      const thumb = document.createElement('img');
      thumb.src = item.url;
      thumb.className = `thumb-item ${idx === carouselIndex ? 'active' : ''}`;
      thumb.addEventListener('click', () => {
        carouselIndex = idx;
        renderCarousel();
      });
      carouselThumbs.appendChild(thumb);
    });

    const activeThumb = carouselThumbs.children[carouselIndex];
    if (activeThumb) {
      activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  }

  carouselPrev.addEventListener('click', () => {
    carouselIndex = (carouselIndex - 1 + currentPhotos.length) % currentPhotos.length;
    renderCarousel();
  });

  carouselNext.addEventListener('click', () => {
    carouselIndex = (carouselIndex + 1) % currentPhotos.length;
    renderCarousel();
  });

  carouselImg.addEventListener('click', () => {
    if (currentPhotos[carouselIndex]) openLightbox(currentPhotos[carouselIndex].url);
  });

  function downloadDataUrl(url, filename) {
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
  }

  function makeTile(id, url) {
    const tile = document.createElement('div');
    tile.className = 'gallery-tile';
    tile.dataset.id = id;

    const img = document.createElement('img');
    img.src = url;
    img.alt = 'Foto van het bezoek';
    img.addEventListener('click', () => openLightbox(url));

    const downloadBtn = document.createElement('button');
    downloadBtn.className = 'gallery-download';
    downloadBtn.type = 'button';
    downloadBtn.title = 'Downloaden';
    downloadBtn.textContent = '⬇';
    downloadBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      downloadDataUrl(url, `utrecht-${id}.jpg`);
    });

    const removeBtn = document.createElement('button');
    removeBtn.className = 'gallery-remove';
    removeBtn.type = 'button';
    removeBtn.title = 'Verwijderen';
    removeBtn.textContent = '✕';
    removeBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (confirm("Weet je zeker dat je deze foto voor iedereen wilt verwijderen?")) {
        await deleteDoc(doc(db, "photos", id));
      }
    });

    tile.appendChild(img);
    tile.appendChild(downloadBtn);
    tile.appendChild(removeBtn);
    return tile;
  }

  // Live Photos Listener
  const photosQuery = query(collection(db, "photos"), orderBy("createdAt", "asc"));
  onSnapshot(photosQuery, (snapshot) => {
    document.querySelectorAll('.gallery-tile').forEach(el => el.remove());

    currentPhotos = [];
    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const id = docSnap.id;
      currentPhotos.push({ id, url: data.url });
      galleryGrid.insertBefore(makeTile(id, data.url), galleryAddBtn);
    });

    updateCount(currentPhotos.length);
    renderCarousel();
    updateMapPopups();
    setStatus('');
  }, (err) => {
    console.error("Firebase read error:", err);
    setStatus("Kon foto's niet laden.");
  });

  // Client-side image compression
  function resizeImage(file, maxDim = 1600, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Bestand kon niet worden gelezen'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('Afbeelding kon niet worden geladen'));
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            const scale = maxDim / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // Upload Photo
  async function addPhotos(files) {
    for (const file of files) {
      if (!file.type.startsWith('image/')) continue;
      setStatus(`Bezig met uploaden: ${file.name}…`);
      try {
        const compressedBlob = await resizeImage(file);
        const fileName = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
        const storageRef = ref(storage, `gallery/${fileName}`);

        await uploadBytes(storageRef, compressedBlob);
        const downloadURL = await getDownloadURL(storageRef);

        await addDoc(collection(db, "photos"), {
          url: downloadURL,
          createdAt: new Date()
        });
      } catch (err) {
        console.error("Upload error:", err);
        setStatus(`Kon "${file.name}" niet uploaden.`);
      }
    }
  }

  galleryAddBtn.addEventListener('click', () => galleryInput.click());
  galleryAddBtnHeader.addEventListener('click', () => galleryInput.click());
  galleryInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length) addPhotos(files);
    galleryInput.value = '';
  });

  downloadAllBtn.addEventListener('click', async () => {
    if (typeof JSZip === 'undefined') {
      setStatus('Zip-bibliotheek kon niet worden geladen.');
      return;
    }
    downloadAllBtn.disabled = true;
    setStatus('Zip-bestand maken…');
    try {
      const zip = new JSZip();
      let count = 0;
      for (const item of currentPhotos) {
        const resp = await fetch(item.url);
        const blob = await resp.blob();
        zip.file(`utrecht-${item.id}.jpg`, blob);
        count++;
      }
      if (count === 0) {
        setStatus("Geen foto's om te downloaden.");
        return;
      }
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(zipBlob);
      downloadDataUrl(url, 'utrecht-fotos.zip');
      URL.revokeObjectURL(url);
      setStatus('');
    } catch (err) {
      console.error(err);
      setStatus('Kon zip-bestand niet maken.');
    } finally {
      downloadAllBtn.disabled = false;
    }
  });

  // Voice Recorder
  recordBtn.addEventListener('click', async () => {
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => { audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        };

        mediaRecorder.start();
        isRecording = true;
        recordBtn.classList.add('recording');
        recordLabel.textContent = 'Stop opname';
        recordIcon.textContent = '⏹️';
        recordTimer.textContent = 'Opnemen...';
      } catch (err) {
        alert('Microfoon toegang is vereist om audio op te nemen.');
      }
    } else {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(track => track.stop());
      isRecording = false;
      recordBtn.classList.remove('recording');
      recordLabel.textContent = 'Opnieuw inspreken';
      recordIcon.textContent = '🎙️';
      recordTimer.textContent = 'Opname gereed!';
    }
  });

  // Save Note & Audio
  saveNoteBtn.addEventListener('click', async () => {
    const text = noteInput.value.trim();

    if (!text && !recordedAudioBlob) {
      alert('Voeg een bericht of een spraakmemo toe.');
      return;
    }

    saveNoteBtn.disabled = true;
    saveNoteBtn.textContent = 'Opslaan…';

    try {
      let audioUrl = null;

      if (recordedAudioBlob) {
        const fileName = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.webm`;
        const audioRef = ref(storage, `journal_audio/${fileName}`);
        await uploadBytes(audioRef, recordedAudioBlob);
        audioUrl = await getDownloadURL(audioRef);
      }

      await addDoc(collection(db, "journal"), {
        text: text,
        audioUrl: audioUrl,
        createdAt: new Date()
      });

      noteInput.value = '';
      recordedAudioBlob = null;
      recordLabel.textContent = 'Inspreken';
      recordTimer.textContent = '';
    } catch (err) {
      console.error("Error saving note:", err);
      alert('Kon de herinnering niet opslaan.');
    } finally {
      saveNoteBtn.disabled = false;
      saveNoteBtn.textContent = 'Opslaan';
    }
  });

  // Live Journal Listener
  const journalQuery = query(collection(db, "journal"), orderBy("createdAt", "desc"));
  onSnapshot(journalQuery, (snapshot) => {
    journalList.innerHTML = '';

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const id = docSnap.id;

      const card = document.createElement('div');
      card.className = 'journal-card';

      const dateStr = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleString('nl-NL', {
        dateStyle: 'medium',
        timeStyle: 'short'
      }) : '';

      const header = document.createElement('div');
      header.className = 'journal-card-header';
      header.innerHTML = `<span>${dateStr}</span>`;

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'journal-card-delete';
      deleteBtn.innerHTML = '✕';
      deleteBtn.title = 'Verwijderen';
      deleteBtn.addEventListener('click', async () => {
        if (confirm("Weet je zeker dat je deze herinnering wilt verwijderen?")) {
          await deleteDoc(doc(db, "journal", id));
        }
      });

      header.appendChild(deleteBtn);
      card.appendChild(header);

      if (data.text) {
        const textEl = document.createElement('div');
        textEl.className = 'journal-text';
        textEl.textContent = data.text;
        card.appendChild(textEl);
      }

      if (data.audioUrl) {
        const audioEl = document.createElement('audio');
        audioEl.className = 'journal-audio';
        audioEl.controls = true;
        audioEl.src = data.audioUrl;
        card.appendChild(audioEl);
      }

      journalList.appendChild(card);
    });
  }, (err) => {
    console.error("Firebase journal read error:", err);
  });
</script>

</body>
