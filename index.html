<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Welkom in Utrecht Paula!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d1f22;
    --ink-soft: #14363c;
    --water: #1c4d58;
    --water-deep: #0d2d34;
    --brick: #cc7f60;
    --gold: #f0c76a;
    --cream: #f7f1e8;
    --sage: #bcd5c6;
    --panel: rgba(16, 31, 33, 0.54);
    --panel-border: rgba(255, 255, 255, 0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 32px 20px 0;
    overflow-x: hidden;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(31, 78, 76, 0.9), rgba(12, 26, 29, 1) 45%, rgba(8, 17, 19, 1) 100%);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    position: relative;
  }

  body::before,
  body::after {
    content: "";
    position: absolute;
    width: 36rem;
    height: 36rem;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
    opacity: 0.5;
  }

  body::before {
    top: -14rem;
    left: -8rem;
    background: rgba(240, 199, 106, 0.18);
  }

  body::after {
    bottom: -17rem;
    right: -10rem;
    background: rgba(82, 161, 174, 0.18);
  }

  .page-shell {
    width: min(1240px, 100%);
    position: relative;
    z-index: 1;
    padding: 28px clamp(18px, 4vw, 42px) 10px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 32px;
    background: linear-gradient(180deg, rgba(17, 36, 38, 0.84), rgba(11, 20, 21, 0.6));
    backdrop-filter: blur(10px);
    box-shadow: 0 28px 80px rgba(0,0,0,0.32);
    overflow: hidden;
  }

  .page-shell::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(120deg, rgba(255,255,255,0.06), transparent 32%, transparent 68%, rgba(240,199,106,0.08));
    pointer-events: none;
  }

  .topbar {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 42px;
    color: var(--sage);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
  }

  .brand::before {
    content: "";
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 18px rgba(240,199,106,0.9);
  }

  .signal-photo {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.18);
    box-shadow: 0 18px 40px rgba(0,0,0,0.28);
    background: rgba(255,255,255,0.04);
    margin: 0 auto 1.25rem;
  }

  .signal-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .status {
    padding: 0.5rem 0.9rem;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    background: rgba(255,255,255,0.02);
  }

  .hero {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: 1.25fr 0.95fr;
    gap: clamp(30px, 4vw, 52px);
    align-items: center;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 1.2rem;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2.6rem, 6vw, 5.2rem);
    line-height: 0.95;
    letter-spacing: -0.04em;
    max-width: 12ch;
  }

  h1 em {
    font-style: italic;
    color: var(--brick);
    font-weight: 500;
  }

  .subtitle {
    margin-top: 1.2rem;
    max-width: 32rem;
    font-size: clamp(1rem, 1.8vw, 1.2rem);
    color: var(--sage);
    line-height: 1.6;
  }

  .city-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.7rem;
    margin-top: 1.3rem;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.52rem 0.8rem;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03);
    color: var(--cream);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    backdrop-filter: blur(8px);
    animation: floatChip 6s ease-in-out infinite;
  }

  .chip:nth-child(2) { animation-delay: 0.9s; }
  .chip:nth-child(3) { animation-delay: 1.7s; }

  .chip::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 12px rgba(240,199,106,0.9);
  }

  .timer-panel {
    margin-top: 2.5rem;
    display: inline-flex;
    flex-direction: column;
    gap: 1rem;
    padding: 1.1rem 1.2rem 1.25rem;
    border: 1px solid var(--panel-border);
    border-radius: 24px;
    background: rgba(14, 22, 24, 0.42);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .timer-wrap {
    display: flex;
    align-items: center;
    gap: 1.3rem;
  }

  .countdown-ring {
    position: relative;
    width: 138px;
    height: 138px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(247,241,232,0.06) 0%, rgba(17,36,38,0.2) 58%, rgba(17,36,38,0.8) 100%);
    box-shadow: inset 0 0 18px rgba(255,255,255,0.04);
  }

  .countdown-ring svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .countdown-ring .bg {
    fill: none;
    stroke: rgba(255,255,255,0.08);
    stroke-width: 8;
  }

  .countdown-ring .progress {
    fill: none;
    stroke: url(#ringGradient);
    stroke-width: 8;
    stroke-linecap: round;
    stroke-dasharray: 314;
    stroke-dashoffset: 314;
    transition: stroke-dashoffset 0.9s ease;
  }

  .countdown-ring .inner {
    position: absolute;
    inset: 18px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(9, 18, 19, 0.82);
    border: 1px solid rgba(255,255,255,0.08);
    text-align: center;
  }

  .countdown-ring .ring-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.55rem;
    font-weight: 700;
    color: var(--cream);
    font-variant-numeric: tabular-nums;
  }

  .countdown-ring .ring-label {
    display: block;
    margin-top: 0.2rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.56rem;
    letter-spacing: 0.12em;
    color: var(--sage);
    text-transform: uppercase;
  }

  .timer {
    display: flex;
    gap: clamp(0.8rem, 2vw, 1.5rem);
    align-items: flex-end;
    justify-content: center;
    flex-wrap: nowrap;
  }

  .unit {
    min-width: 4.8rem;
    text-align: center;
    padding: 0.8rem 0.55rem 0.4rem;
    border-radius: 18px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.05);
  }

  .unit .value {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: clamp(1.9rem, 4vw, 3.2rem);
    color: var(--cream);
    line-height: 1;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }

  .unit .label {
    display: block;
    margin-top: 0.65rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--sage);
  }

  .divider {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(1.8rem, 3vw, 2.7rem);
    color: rgba(247,241,232,0.25);
    padding-bottom: 1.2rem;
  }

  .timer-foot {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    color: var(--sage);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.66rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .timer-foot::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 18px rgba(240,199,106,0.9);
    animation: pulse 2.8s ease-in-out infinite;
  }

  .visual-column {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    transform: translateY(-8px);
  }

  .photo-card {
    position: relative;
    border-radius: 28px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.12);
    background-size: cover;
    background-position: center;
    box-shadow: 0 24px 56px rgba(0,0,0,0.26);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    animation: floatPhoto 6s ease-in-out infinite;
  }

  .photo-card:hover {
    transform: translateY(-6px) scale(1.01);
    box-shadow: 0 30px 64px rgba(0,0,0,0.32);
  }

  .photo-main { animation-delay: 0.2s; }
  .small-one { animation-delay: 0.8s; }
  .small-two { animation-delay: 1.4s; }

  .photo-main {
    height: 21rem;
    background-image:
      linear-gradient(180deg, rgba(8, 17, 19, 0.12), rgba(8,17,19,0.62)),
      url('https://upload.wikimedia.org/wikipedia/commons/9/9c/Utrecht_Canal_Pride_2018%2C_03.jpg');
  }

  .mini-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  .small {
    height: 10.5rem;
  }

  .small-one {
    background-image:
      linear-gradient(180deg, rgba(8,17,19,0.12), rgba(8,17,19,0.55)),
      url('https://upload.wikimedia.org/wikipedia/commons/6/6c/Domtoren_Utrecht_-_1.jpg');
  }

  .small-two {
    background-image:
      linear-gradient(180deg, rgba(8,17,19,0.12), rgba(8,17,19,0.55)),
      url('https://upload.wikimedia.org/wikipedia/commons/4/4f/Caf%C3%A9_in_Hoog_Catharijne.jpg');
  }

  .card-label {
    position: absolute;
    left: 1rem;
    bottom: 1rem;
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.55rem 0.8rem;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(12, 16, 18, 0.5);
    color: var(--cream);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .card-label::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #8dd4d0;
    box-shadow: 0 0 14px rgba(141,212,208,0.8);
  }

  .water-band {
    position: relative;
    margin-top: 28px;
    width: min(1240px, 100%);
    height: 110px;
    background: linear-gradient(180deg, rgba(28,77,88,0.15), rgba(13,45,52,0.88));
    border-radius: 0 0 28px 28px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    border-top: 0;
  }

  .water-band::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent 0,
      transparent 24px,
      rgba(255,255,255,0.05) 24px,
      rgba(255,255,255,0.05) 26px
    );
    opacity: 0.7;
  }

  .water-band::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 0%, rgba(240,199,106,0.16) 100%);
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  @keyframes floatChip {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-3px); }
  }

  @keyframes floatPhoto {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
  }

  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; }
    .visual-column { max-width: 32rem; width: 100%; margin: 0 auto; }
  }

  @media (max-width: 560px) {
    .topbar {
      flex-direction: column;
      gap: 0.8rem;
      align-items: flex-start;
    }

    .timer {
      gap: 0.5rem;
      justify-content: space-between;
    }

    .unit {
      min-width: 3.7rem;
    }

    .divider {
      display: none;
    }

    .photo-main { height: 18rem; }
    .small { height: 8.8rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">Utrecht · Paula</div>
      <div class="status">Countdown</div>
    </header>

    <main class="hero">
      <section class="copy-block">
        <div class="eyebrow">Een teller tot Utrecht</div>
        <h1>Welkom <em>in</em> Utrecht, Paula!</h1>
        <p class="subtitle" id="subtitle">Nog even geduld — dan sta je middenin de grachten.</p>

        <div class="city-tags" aria-label="Utrecht highlights">
          <span class="chip">Oudegracht</span>
          <span class="chip">Domtoren</span>
          <span class="chip">Janskerkhof</span>
        </div>

        <div class="timer-panel">
          <div class="timer-wrap">
            <div class="countdown-ring" aria-label="Aankomst countdown">
              <svg viewBox="0 0 120 120" role="img" aria-hidden="true">
                <defs>
                  <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f0c76a" />
                    <stop offset="50%" stop-color="#cc7f60" />
                    <stop offset="100%" stop-color="#8dd4d0" />
                  </linearGradient>
                </defs>
                <circle class="bg" cx="60" cy="60" r="50"></circle>
                <circle class="progress" cx="60" cy="60" r="50"></circle>
              </svg>
              <div class="inner">
                <div>
                  <div class="ring-value" id="ringValue">00</div>
                  <span class="ring-label">dagen</span>
                </div>
              </div>
            </div>

            <div class="timer" aria-live="polite">
              <div class="unit"><span class="value" id="days">00</span><span class="label">dagen</span></div>
              <span class="divider">:</span>
              <div class="unit"><span class="value" id="hours">00</span><span class="label">uren</span></div>
              <span class="divider">:</span>
              <div class="unit"><span class="value" id="minutes">00</span><span class="label">minuten</span></div>
              <span class="divider">:</span>
              <div class="unit"><span class="value" id="seconds">00</span><span class="label">seconden</span></div>
            </div>
          </div>
          <div class="timer-foot">Naar de Domtoren</div>
        </div>
      </section>

      <aside class="visual-column" aria-label="Utrecht inspiration">
        <div class="signal-photo" aria-label="Signal artwork">
          <img src="signal-2026-08-29-14-23-35-847.jpg" alt="Signal artwork" />
        </div>

        <div class="photo-card photo-main">
          <span class="card-label">Oudegracht</span>
        </div>

        <div class="mini-cards">
          <div class="photo-card small small-one">
            <span class="card-label">Domtoren</span>
          </div>
          <div class="photo-card small small-two">
            <span class="card-label">Cafés</span>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <div class="water-band" aria-hidden="true"></div>

  <script>
    const TARGET_DATE = "2026-08-29T21:36:00";
    const SUBTITLE_TEXT = "Nog even geduld — dan sta je middenin de grachten.";

    const subtitle = document.getElementById('subtitle');
    const target = new Date(TARGET_DATE).getTime();
    const ring = document.querySelector('.progress');
    const ringValue = document.getElementById('ringValue');

    subtitle.textContent = SUBTITLE_TEXT;

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    function updateRing(daysLeft, totalDays) {
      const radius = 50;
      const circumference = 2 * Math.PI * radius;
      const progressRatio = Math.max(0, Math.min(1, daysLeft / totalDays));
      const offset = circumference * (1 - progressRatio);

      ring.style.strokeDasharray = String(circumference);
      ring.style.strokeDashoffset = String(offset);
      ringValue.textContent = pad(daysLeft);
    }

    function tick() {
      const now = Date.now();
      const diff = target - now;

      if (diff <= 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        subtitle.textContent = 'Welkom thuis in Utrecht. 🎉';
        ringValue.textContent = '00';
        ring.style.strokeDashoffset = '314';
        clearInterval(timerInterval);
        return;
      }

      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const minutes = Math.floor((diff % 3600000) / 60000);
      const seconds = Math.floor((diff % 60000) / 1000);

      document.getElementById('days').textContent = pad(days);
      document.getElementById('hours').textContent = pad(hours);
      document.getElementById('minutes').textContent = pad(minutes);
      document.getElementById('seconds').textContent = pad(seconds);

      const totalDays = 30;
      updateRing(days, totalDays);
    }

    tick();
    const timerInterval = setInterval(tick, 1000);

    document.addEventListener('pointermove', (event) => {
      const x = (event.clientX / window.innerWidth - 0.5) * 12;
      const y = (event.clientY / window.innerHeight - 0.5) * 10;

      document.querySelector('.page-shell').style.transform = `perspective(1200px) rotateX(${(-y).toFixed(2)}deg) rotateY(${x.toFixed(2)}deg)`;
    });

    document.addEventListener('pointerleave', () => {
      document.querySelector('.page-shell').style.transform = 'perspective(1200px) rotateX(0deg) rotateY(0deg)';
    });
  </script>
</body>
</html>
