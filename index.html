<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Welkom in Utrecht Paula!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --ink: #0d1f22;
    --ink-soft: #14363c;
    --water: #1c4d58;
    --water-deep: #0d2d34;
    --brick: #cc7f60;
    --gold: #f0c76a;
    --cream: #f7f1e8;
    --sage: #bcd5c6;
    --panel: rgba(16, 31, 33, 0.54);
    --panel-border: rgba(255, 255, 255, 0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    height: auto;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding: 32px 20px 96px;
    overflow-x: hidden;
    overflow-y: auto;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(31, 78, 76, 0.9), rgba(12, 26, 29, 1) 45%, rgba(8, 17, 19, 1) 100%);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    position: relative;
  }

  body::before,
  body::after {
    content: "";
    position: absolute;
    width: 36rem;
    height: 36rem;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
    opacity: 0.5;
  }

  body::before {
    top: -14rem;
    left: -8rem;
    background: rgba(240, 199, 106, 0.18);
  }

  body::after {
    bottom: -17rem;
    right: -10rem;
    background: rgba(82, 161, 174, 0.18);
  }

  .page-shell {
    width: min(1240px, 100%);
    position: relative;
    z-index: 1;
    margin: 0 auto;
    padding: 28px clamp(18px, 4vw, 42px) 10px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 32px;
    background: linear-gradient(180deg, rgba(17, 36, 38, 0.84), rgba(11, 20, 21, 0.6));
    backdrop-filter: blur(10px);
    box-shadow: 0 28px 80px rgba(0,0,0,0.32);
    overflow: hidden;
  }

  .page-shell::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(120deg, rgba(255,255,255,0.06), transparent 32%, transparent 68%, rgba(240,199,106,0.08));
    pointer-events: none;
  }

  .topbar {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 36px;
    color: var(--sage);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
  }

  .brand::before {
    content: "";
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 18px rgba(240,199,106,0.9);
  }

  /* --- Intro (secondary, compact) --- */
  .intro {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 46rem;
    margin: 0 auto 2.6rem;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 1rem;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2rem, 4.4vw, 3.4rem);
    line-height: 1;
    letter-spacing: -0.03em;
  }

  h1 em {
    font-style: italic;
    color: var(--brick);
    font-weight: 500;
  }

  .subtitle {
    margin: 1rem auto 0;
    max-width: 30rem;
    font-size: 1rem;
    color: var(--sage);
    line-height: 1.6;
  }

  .city-tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.7rem;
    margin-top: 1.3rem;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.52rem 0.8rem;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03);
    color: var(--cream);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    backdrop-filter: blur(8px);
    animation: floatChip 6s ease-in-out infinite;
  }

  .chip:nth-child(2) { animation-delay: 0.9s; }
  .chip:nth-child(3) { animation-delay: 1.7s; }

  .chip::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 12px rgba(240,199,106,0.9);
  }

  .signal-stack {
    display: flex;
    justify-content: center;
    gap: 0.8rem;
    margin: 1.6rem auto 0;
  }

  .signal-photo {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.18);
    box-shadow: 0 18px 40px rgba(0,0,0,0.28);
    background: rgba(255,255,255,0.04);
  }

  .signal-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* --- Gallery: the main event --- */
  .gallery-section {
    position: relative;
    z-index: 2;
  }

  .gallery-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.9rem;
    margin-bottom: 1.3rem;
  }

  .gallery-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    font-weight: 600;
    color: var(--cream);
  }

  .gallery-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    color: var(--sage);
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.9rem;
  }

  .gallery-grid .gallery-tile:first-child,
  .gallery-grid .gallery-tile:nth-child(5) {
    grid-column: span 2;
    grid-row: span 2;
  }

  .gallery-tile {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    overflow: hidden;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
  }

  .gallery-tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    cursor: pointer;
    transition: transform 0.35s ease;
  }

  .gallery-tile img:hover {
    transform: scale(1.04);
  }

  .gallery-remove {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(9, 18, 19, 0.72);
    color: var(--cream);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s ease, background 0.2s ease;
  }

  .gallery-tile:hover .gallery-remove {
    opacity: 1;
  }

  .gallery-remove:hover {
    background: rgba(204, 127, 96, 0.85);
  }

  .gallery-download {
    position: absolute;
    top: 0.5rem;
    left: 0.5rem;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(9, 18, 19, 0.72);
    color: var(--cream);
    font-size: 0.8rem;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: opacity 0.2s ease, background 0.2s ease;
  }

  .gallery-tile:hover .gallery-download {
    opacity: 1;
  }

  .gallery-download:hover {
    background: rgba(240, 199, 106, 0.85);
    color: var(--ink);
  }

  .gallery-head-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.8rem;
  }

  .gallery-download-all {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 0.75rem;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.03);
    color: var(--sage);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  .gallery-download-all:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  .gallery-download-all:disabled {
    opacity: 0.4;
    cursor: default;
    border-color: rgba(255,255,255,0.14);
    color: var(--sage);
  }

  .gallery-add-header {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 0.75rem;
    border-radius: 999px;
    border: 1px solid var(--gold);
    background: rgba(240, 199, 106, 0.1);
    color: var(--gold);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .gallery-add-header:hover {
    background: var(--gold);
    color: var(--ink);
  }

  .gallery-add {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    border: 1px dashed rgba(255,255,255,0.22);
    border-radius: 18px;
    background: transparent;
    color: var(--sage);
    cursor: pointer;
    aspect-ratio: 1 / 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.64rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }

  .gallery-add:hover {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(240,199,106,0.05);
  }

  .gallery-add .plus {
    font-family: 'Fraunces', serif;
    font-size: 2.2rem;
    line-height: 1;
    font-weight: 400;
  }

  .gallery-status {
    margin-top: 1rem;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    color: var(--sage);
    min-height: 0.9rem;
  }

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(6, 12, 13, 0.86);
    backdrop-filter: blur(6px);
    padding: 2rem;
  }

  .lightbox.open {
    display: flex;
  }

  .lightbox img {
    max-width: min(90vw, 900px);
    max-height: 85vh;
    border-radius: 12px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.5);
  }

  .lightbox-close {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(9,18,19,0.6);
    color: var(--cream);
    font-size: 1.1rem;
    cursor: pointer;
  }

  .water-band {
    position: relative;
    margin-top: 28px;
    width: min(1240px, 100%);
    height: 110px;
    background: linear-gradient(180deg, rgba(28,77,88,0.15), rgba(13,45,52,0.88));
    border-radius: 0 0 28px 28px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    border-top: 0;
  }

  .water-band::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent 0,
      transparent 24px,
      rgba(255,255,255,0.05) 24px,
      rgba(255,255,255,0.05) 26px
    );
    opacity: 0.7;
  }

  .water-band::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 0%, rgba(240,199,106,0.16) 100%);
  }

  /* --- Timer: pushed to the background, a quiet floating badge --- */
  .timer-badge {
    position: fixed;
    left: 1.2rem;
    bottom: 1.2rem;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.55rem 0.9rem;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(10, 20, 22, 0.55);
    backdrop-filter: blur(8px);
    opacity: 0.7;
    transition: opacity 0.25s ease;
  }

  .timer-badge:hover {
    opacity: 1;
  }

  .timer-badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 10px rgba(240,199,106,0.8);
    animation: pulse 2.8s ease-in-out infinite;
    flex-shrink: 0;
  }

  .timer-badge .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--sage);
  }

  .timer-badge .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--cream);
    font-variant-numeric: tabular-nums;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  @keyframes floatChip {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-3px); }
  }

  @media (max-width: 700px) {
    .gallery-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .gallery-grid .gallery-tile:first-child,
    .gallery-grid .gallery-tile:nth-child(5) {
      grid-column: span 2;
      grid-row: span 1;
    }

    .timer-badge {
      left: 50%;
      transform: translateX(-50%);
      bottom: 0.9rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">Utrecht · Paula</div>
    </header>

    <section class="intro">
      <div class="eyebrow">Onze grachtenstad</div>
      <h1>Welkom <em>in</em> Utrecht, Paula!</h1>
      <p class="subtitle" id="subtitle">Nog even geduld — dan sta je middenin de grachten.</p>

      <div class="city-tags" aria-label="Utrecht highlights">
        <span class="chip">Oudegracht</span>
        <span class="chip">Domtoren</span>
        <span class="chip">Janskerkhof</span>
      </div>

      <div class="signal-stack" aria-label="Signal artwork collection">
        <div class="signal-photo" aria-label="Signal artwork one">
          <img src="media/daphne.jpg" alt="Signal artwork one" />
        </div>
        <div class="signal-photo" aria-label="Signal artwork two">
          <img src="media/paula_crazy.jpg" alt="Signal artwork two" />
        </div>
        <div class="signal-photo" aria-label="Signal artwork two">
          <img src="media/valentin.jpg" alt="Signal artwork two" />
        </div>
      </div>
    </section>

    <section class="gallery-section" aria-label="Foto's van het bezoek">
      <div class="gallery-head">
        <span class="gallery-title">Foto's van het bezoek</span>
        <div class="gallery-head-actions">
          <button class="gallery-add-header" id="galleryAddBtnHeader" type="button">+ Foto toevoegen</button>
          <button class="gallery-download-all" id="downloadAllBtn" type="button" disabled>Alles downloaden</button>
          <span class="gallery-count" id="galleryCount">0 foto's</span>
        </div>
      </div>
      <div class="gallery-grid" id="galleryGrid">
        <button class="gallery-add" id="galleryAddBtn" type="button">
          <span class="plus">+</span>
          <span>Foto toevoegen</span>
        </button>
      </div>
      <input type="file" id="galleryInput" accept="image/*" multiple hidden />
      <div class="gallery-status" id="galleryStatus"></div>
    </section>
  </div>

  <div class="water-band" aria-hidden="true"></div>

  <!-- Timer: intentionally understated, tucked away in the corner -->
  <div class="timer-badge" aria-label="Aankomst countdown">
    <span class="dot"></span>
    <span class="label">Domtoren over</span>
    <span class="value" id="timerValue">—</span>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" type="button">✕</button>
    <img id="lightboxImg" src="" alt="Vergrote foto" />
  </div>

  <script>
    const TARGET_DATE = "2026-08-29T21:36:00";
    const SUBTITLE_TEXT = "Nog even geduld — dan sta je middenin de grachten.";

    const subtitle = document.getElementById('subtitle');
    const target = new Date(TARGET_DATE).getTime();
    const timerValue = document.getElementById('timerValue');

    subtitle.textContent = SUBTITLE_TEXT;

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    let timerInterval = null;

    function tick() {
      const now = Date.now();
      const diff = target - now;

      if (diff <= 0) {
        subtitle.textContent = 'Welkom thuis in Utrecht. 🎉';
        timerValue.textContent = 'aangekomen';
        if (timerInterval) clearInterval(timerInterval);
        return;
      }

      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const minutes = Math.floor((diff % 3600000) / 60000);
      const seconds = Math.floor((diff % 60000) / 1000);

      timerValue.textContent = `${days}d ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    tick();
    timerInterval = setInterval(tick, 1000);

    // --- Gallery: persisted via window.storage (personal, this browser/account only) ---
    const GALLERY_INDEX_KEY = 'gallery-index';
    const galleryGrid = document.getElementById('galleryGrid');
    const galleryAddBtn = document.getElementById('galleryAddBtn');
    const galleryAddBtnHeader = document.getElementById('galleryAddBtnHeader');
    const galleryInput = document.getElementById('galleryInput');
    const galleryCount = document.getElementById('galleryCount');
    const galleryStatus = document.getElementById('galleryStatus');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');

    // Storage layer: prefer Claude's window.storage (works when viewed inside
    // Claude). When this file is downloaded and opened directly in a normal
    // browser, window.storage won't exist, so we fall back to localStorage,
    // and finally to an in-memory Map if even that is blocked (e.g. some
    // browsers restrict localStorage for file:// pages).
    const memoryStore = new Map();
    const LS_PREFIX = 'utrecht-gallery::';
    let storageMode = 'memory';

    function lsAvailable() {
      try {
        const testKey = '__utrecht_gallery_test__';
        localStorage.setItem(testKey, '1');
        localStorage.removeItem(testKey);
        return true;
      } catch (e) {
        return false;
      }
    }

    if (window.storage && typeof window.storage.get === 'function') {
      storageMode = 'claude';
    } else if (lsAvailable()) {
      storageMode = 'local';
    }

    async function storageGet(key) {
      if (storageMode === 'claude') {
        try {
          return await window.storage.get(key, false);
        } catch (e) {
          return null;
        }
      }
      if (storageMode === 'local') {
        const raw = localStorage.getItem(LS_PREFIX + key);
        return raw !== null ? { key, value: raw } : null;
      }
      return memoryStore.has(key) ? { key, value: memoryStore.get(key) } : null;
    }

    async function storageSet(key, value) {
      if (storageMode === 'claude') {
        try {
          return await window.storage.set(key, value, false);
        } catch (e) {
          return null;
        }
      }
      if (storageMode === 'local') {
        try {
          localStorage.setItem(LS_PREFIX + key, value);
          return { key, value };
        } catch (e) {
          return null;
        }
      }
      memoryStore.set(key, value);
      return { key, value };
    }

    async function storageDelete(key) {
      if (storageMode === 'claude') {
        try {
          return await window.storage.delete(key, false);
        } catch (e) {
          return null;
        }
      }
      if (storageMode === 'local') {
        localStorage.removeItem(LS_PREFIX + key);
        return { key, deleted: true };
      }
      memoryStore.delete(key);
      return { key, deleted: true };
    }

    function setStatus(msg) {
      galleryStatus.textContent = msg || '';
    }

    function updateCount(n) {
      galleryCount.textContent = n === 1 ? '1 foto' : `${n} foto's`;
      downloadAllBtn.disabled = n === 0;
    }

    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    function downloadDataUrl(dataUrl, filename) {
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function makeTile(id, dataUrl) {
      const tile = document.createElement('div');
      tile.className = 'gallery-tile';
      tile.dataset.id = id;

      const img = document.createElement('img');
      img.src = dataUrl;
      img.alt = 'Foto van het bezoek';
      img.addEventListener('click', () => openLightbox(dataUrl));

      const downloadBtn = document.createElement('button');
      downloadBtn.className = 'gallery-download';
      downloadBtn.type = 'button';
      downloadBtn.title = 'Downloaden';
      downloadBtn.textContent = '⬇';
      downloadBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        downloadDataUrl(dataUrl, `utrecht-${id}.jpg`);
      });

      const removeBtn = document.createElement('button');
      removeBtn.className = 'gallery-remove';
      removeBtn.type = 'button';
      removeBtn.title = 'Verwijderen';
      removeBtn.textContent = '✕';
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        removePhoto(id, tile);
      });

      tile.appendChild(img);
      tile.appendChild(downloadBtn);
      tile.appendChild(removeBtn);
      return tile;
    }

    async function getIndex() {
      try {
        const result = await storageGet(GALLERY_INDEX_KEY);
        if (result && result.value) return JSON.parse(result.value);
        return [];
      } catch (err) {
        return [];
      }
    }

    async function saveIndex(ids) {
      try {
        await storageSet(GALLERY_INDEX_KEY, JSON.stringify(ids));
      } catch (err) {
        console.error('Kon fotolijst niet opslaan', err);
      }
    }

    async function loadGallery() {
      setStatus('Foto\u2019s laden…');
      const ids = await getIndex();
      updateCount(ids.length);
      for (const id of ids) {
        try {
          const result = await storageGet(`gallery-photo:${id}`);
          if (result && result.value) {
            galleryGrid.insertBefore(makeTile(id, result.value), galleryAddBtn);
          }
        } catch (err) {
          // skip missing/broken entries
        }
      }
      if (storageMode === 'memory') {
        setStatus('Let op: foto\u2019s blijven alleen bewaard zolang deze pagina open staat.');
      } else {
        setStatus('');
      }
    }

    function resizeImage(file, maxDim = 1600, quality = 0.85) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Bestand kon niet worden gelezen'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Afbeelding kon niet worden geladen'));
          img.onload = () => {
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              const scale = maxDim / Math.max(width, height);
              width = Math.round(width * scale);
              height = Math.round(height * scale);
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function addPhotos(files) {
      const ids = await getIndex();
      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;
        setStatus(`Bezig met opslaan: ${file.name}…`);
        try {
          const dataUrl = await resizeImage(file);
          const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
          const result = await storageSet(`gallery-photo:${id}`, dataUrl);
          if (!result) throw new Error('Opslaan mislukt');
          ids.push(id);
          galleryGrid.insertBefore(makeTile(id, dataUrl), galleryAddBtn);
          updateCount(ids.length);
        } catch (err) {
          console.error(err);
          setStatus(`Kon "${file.name}" niet opslaan${storageMode === 'local' ? ' (mogelijk te groot voor lokale opslag)' : ''}.`);
        }
      }
      await saveIndex(ids);
      if (storageMode === 'memory') {
        setStatus('Let op: foto\u2019s blijven alleen bewaard zolang deze pagina open staat.');
      } else {
        setStatus('');
      }
    }

    async function removePhoto(id, tileEl) {
      try {
        await storageDelete(`gallery-photo:${id}`);
        const ids = (await getIndex()).filter((existing) => existing !== id);
        await saveIndex(ids);
        tileEl.remove();
        updateCount(ids.length);
      } catch (err) {
        console.error('Kon foto niet verwijderen', err);
        setStatus('Kon foto niet verwijderen.');
      }
    }

    galleryAddBtn.addEventListener('click', () => galleryInput.click());
    galleryAddBtnHeader.addEventListener('click', () => galleryInput.click());
    galleryInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      if (files.length) addPhotos(files);
      galleryInput.value = '';
    });

    downloadAllBtn.addEventListener('click', async () => {
      if (typeof JSZip === 'undefined') {
        setStatus('Zip-bibliotheek kon niet worden geladen — controleer je internetverbinding.');
        return;
      }
      downloadAllBtn.disabled = true;
      setStatus('Zip-bestand maken…');
      try {
        const ids = await getIndex();
        const zip = new JSZip();
        let count = 0;
        for (const id of ids) {
          const result = await storageGet(`gallery-photo:${id}`);
          if (result && result.value) {
            const base64 = result.value.split(',')[1];
            zip.file(`utrecht-${id}.jpg`, base64, { base64: true });
            count++;
          }
        }
        if (count === 0) {
          setStatus('Geen foto\u2019s om te downloaden.');
          return;
        }
        const blob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(blob);
        downloadDataUrl(url, 'utrecht-fotos.zip');
        URL.revokeObjectURL(url);
        setStatus('');
      } catch (err) {
        console.error(err);
        setStatus('Kon zip-bestand niet maken.');
      } finally {
        downloadAllBtn.disabled = false;
      }
    });

    loadGallery();
  </script>
</body>
</html>
